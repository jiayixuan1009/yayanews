# 复制到 /etc/nginx/sites-available/yayanews 后 ln -s，certbot 申请证书
# server_name 已对齐 yayanews.cryptooptiontool.com
#
# ⚠️ 此为生产真实生效的配置（部署脚本会复制到 /etc/nginx/sites-available/yayanews）。
# 修改前请同步 infra/nginx/yayanews.conf，避免再次出现两份漂移。

upstream yayanews_next {
    server 127.0.0.1:3002;
    keepalive 64;
}

upstream yayanews_ws {
    server 127.0.0.1:3001;
    keepalive 16;
}

# Restore the visitor address only when the immediate peer is a trusted
# Cloudflare proxy. Keep this list aligned with https://www.cloudflare.com/ips/.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# Do not log query strings or cookies. CF-Ray and the retained proxy address
# are enough to correlate origin requests with Cloudflare traffic analytics.
log_format yayanews_cf escape=json
    '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
    '$status $body_bytes_sent rt=$request_time '
    'host="$host" ref="$http_referer" ua="$http_user_agent" '
    'cf_ray="$http_cf_ray" cf_edge="$realip_remote_addr"';

# Rate limiting zones（必须放在 server 之外，http context 内）
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name yayanews.cryptooptiontool.com;
    access_log /var/log/nginx/yayanews.access.log yayanews_cf;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name yayanews.cryptooptiontool.com;
    access_log /var/log/nginx/yayanews.access.log yayanews_cf;

    ssl_certificate     /etc/letsencrypt/live/yayanews.cryptooptiontool.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yayanews.cryptooptiontool.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 16m;

    # ── Security headers ────────────────────────────────────────────────
    # Security headers are owned solely by the Next.js app (apps/web/next.config.mjs)
    # so HTML responses carry a single, consistent set incl. CSP/frame-ancestors.
    # Do NOT re-add them here, or responses end up with duplicate/conflicting
    # values (e.g. X-Frame-Options DENY vs SAMEORIGIN).

    # Block hidden-file probes before they reach Next.js.
    location ~ /\.(?!well-known/) {
        access_log off;
        return 404;
    }

    # ── 静态资源（直接磁盘投递，跳过 Next.js）────────────────────────────
    location /brand/ {
        alias /var/www/yayanews/apps/web/.next/standalone/apps/web/public/brand/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /images/ {
        alias /var/www/yayanews/apps/web/.next/standalone/apps/web/public/images/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /covers/ {
        alias /var/www/yayanews/apps/web/.next/standalone/apps/web/public/covers/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SSE 长连接（快讯/首页实时刷新）
    location ~ ^/api/(flash/events|live/events) {
        proxy_pass http://yayanews_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # WebSocket live updates.
    location /ws/ {
        proxy_pass http://yayanews_ws;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Admin Panel (apps/admin running on 3003)
    location /admin {
        limit_req zone=admin_limit burst=10 nodelay;
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets for Admin Panel (Fixes 404 on CSS/JS due to basePath injection)
    location /admin/_next/static/ {
        alias /var/www/yayanews/apps/admin/.next/standalone/apps/admin/.next/static/;
        access_log off;
        expires 365d;
    }

    # REST Admin API (apps/admin/api)
    location /api/admin {
        limit_req zone=admin_limit burst=10 nodelay;
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 公共 API 限流
    location /api/ {
        limit_req zone=api_limit burst=15 nodelay;
        proxy_pass http://yayanews_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 维护页（Next.js 宕机时返回静态 503）
    error_page 502 503 504 /503.html;
    location = /503.html {
        root /var/www/yayanews/apps/web/public;
        internal;
    }

    # Main Web App
    location / {
        proxy_pass http://yayanews_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect http://localhost:3002/ /;
        proxy_redirect https://localhost:3002/ /;
        proxy_redirect http://127.0.0.1:3002/ /;
        proxy_redirect https://127.0.0.1:3002/ /;
    }
}
