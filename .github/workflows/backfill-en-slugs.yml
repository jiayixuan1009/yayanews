name: Backfill English Article Slugs

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply slug updates. Leave false for dry-run."
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      limit:
        description: "Maximum English articles to scan."
        required: true
        default: "10000"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  APP_DIR: /var/www/yayanews

jobs:
  backfill:
    name: Backfill English slug redirects
    runs-on: ubuntu-latest
    steps:
      - name: Run backfill on production host
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd "${{ env.APP_DIR }}"

            APPLY="${{ inputs.apply }}"
            LIMIT="${{ inputs.limit }}"
            if ! printf '%s' "$LIMIT" | grep -Eq '^[0-9]+$'; then
              echo "limit must be a positive integer."
              exit 1
            fi

            args=(--env .env --limit "$LIMIT")
            if [ "$APPLY" = "true" ]; then
              args+=(--apply)
            fi

            echo "Running English slug backfill on $(hostname) in $(pwd)"
            echo "Mode: $([ "$APPLY" = "true" ] && echo apply || echo dry-run), limit: $LIMIT"
            npm run db:backfill:en-slugs -- "${args[@]}"
