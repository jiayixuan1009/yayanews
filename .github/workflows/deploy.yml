name: Deploy to Production

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd /var/www/yayanews

            echo "Deploying tag: ${{ github.ref_name }}"
            dirty_status="$(git status --porcelain --untracked-files=normal | grep -Ev '^\?\? infra/deploy/[^/]+\.log(\.[0-9]+)?$' || true)"
            if [ -n "$dirty_status" ]; then
              echo "Production worktree is dirty; snapshotting and aborting before checkout."
              echo "::group::Production dirty status"
              printf '%s\n' "$dirty_status" || true
              echo "::endgroup::"
              echo "::group::Production tracked diff stat"
              git diff --stat || true
              echo "::endgroup::"
              echo "::group::Production untracked files"
              git ls-files --others --exclude-standard || true
              echo "::endgroup::"
              if [ -f infra/scripts/snapshot-worktree.sh ]; then
                bash infra/scripts/snapshot-worktree.sh
              else
                mkdir -p infra/backups/worktree
                git status --short > "infra/backups/worktree/dirty-status-${{ github.run_id }}.txt"
              fi
              exit 1
            fi

            echo "Pulling latest code..."
            git fetch --all --tags
            git checkout --detach "${{ github.ref_name }}"

            echo "Running deploy script..."
            bash deploy/publish-yayanews.sh

            echo "Deployment complete: ${{ github.ref_name }}"
