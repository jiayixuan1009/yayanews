name: Deploy to Production

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch: {}

# 仓库转为 PRIVATE 后,服务器匿名 fetch 会失败(could not read Username for 'https://github.com')。
# 这里需要只读的 contents 权限,以便把 GITHUB_TOKEN 传给服务器用于拉取。
permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          # 优先使用专用的只读 token(若已配置 DEPLOY_GIT_TOKEN secret),
          # 否则回退到本 workflow 的一次性 GITHUB_TOKEN(仅 contents: read)。
          DEPLOY_GIT_TOKEN: ${{ secrets.DEPLOY_GIT_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          envs: DEPLOY_GIT_TOKEN
          script: |
            set -euo pipefail
            cd /var/www/yayanews

            echo "Deploying ${{ github.ref_name }} @ ${{ github.sha }}"
            dirty_status="$(git status --porcelain --untracked-files=normal | grep -Ev '^\?\? infra/deploy/[^/]+\.log(\.[0-9]+)?$' || true)"
            if [ -n "$dirty_status" ]; then
              echo "Production worktree is dirty; snapshotting and aborting before checkout."
              echo "::group::Production dirty status"
              printf '%s\n' "$dirty_status" || true
              echo "::endgroup::"
              echo "::group::Production tracked diff stat"
              git diff --stat || true
              echo "::endgroup::"
              echo "::group::Production untracked files"
              git ls-files --others --exclude-standard || true
              echo "::endgroup::"
              if [ -f infra/scripts/snapshot-worktree.sh ]; then
                bash infra/scripts/snapshot-worktree.sh
              else
                mkdir -p infra/backups/worktree
                git status --short > "infra/backups/worktree/dirty-status-${{ github.run_id }}.txt"
              fi
              exit 1
            fi

            echo "Pulling latest code (authenticated)..."
            if [ -z "${DEPLOY_GIT_TOKEN:-}" ]; then
              echo "DEPLOY_GIT_TOKEN is empty; cannot fetch a private repository." >&2
              exit 1
            fi
            # 一次性凭据文件(600):不写入 .git/config,不进命令行参数,退出时自动删除。
            cred_file="$(mktemp)"
            chmod 600 "$cred_file"
            trap 'rm -f "$cred_file"' EXIT
            printf 'https://x-access-token:%s@github.com\n' "$DEPLOY_GIT_TOKEN" > "$cred_file"
            # --force:2026-10-18 的密钥清理改写了历史并 force-push 了标签,
            # 服务器上仍有改写前的旧标签对象,不加 --force 会以
            # "would clobber existing tag" 失败。部署机的唯一事实来源是远端,强制同步是正确的。
            git -c credential.helper= \
                -c credential.helper="store --file=$cred_file" \
                fetch --all --tags --force
            git checkout --detach "${{ github.sha }}"

            echo "Installing and validating Nginx configuration..."
            sudo -n bash infra/scripts/install-yayanews-nginx.sh

            echo "Running deploy script..."
            bash deploy/publish-yayanews.sh

            echo "Deployment complete: ${{ github.ref_name }}"
